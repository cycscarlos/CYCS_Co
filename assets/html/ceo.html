<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlos Colmenares A. - Design and Development</title>
    <!-- Fuente moderna Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Declarar la función en el head para que esté lista antes de que cargue el HTML
      function handleImageError(img) {
        var sources = [
          "ceo.webp",
          "../img/ceo/ceo.webp",
          "https://placehold.co/500x500/1a1a1a/ffffff?text=Carlos+Colmenares",
        ];

        var currentSrc = img.getAttribute("data-tried-src") || img.src;
        var currentIndex = -1;

        for (var i = 0; i < sources.length; i++) {
          if (currentSrc.indexOf(sources[i]) !== -1) {
            currentIndex = i;
            break;
          }
        }

        var nextIndex = currentIndex + 1;

        if (nextIndex < sources.length) {
          img.setAttribute("data-tried-src", sources[nextIndex]);
          img.src = sources[nextIndex];
        }
      }
    </script>

    <style>
      /* Reset y Estilos Base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #050505;
        color: #ffffff;
        font-family:
          "Space Grotesk",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        overflow-x: hidden;
      }

      /* Layout Hero de Dos Columnas en Pantalla Completa (Desktop) */
      .hero-container {
        display: flex;
        min-height: 100vh;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        padding: 2rem 5%;
        gap: 3rem;
        position: relative;
      }

      /* Columna Izquierda: Texto */
      .hero-text-content {
        flex: 1 1 55%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        z-index: 2;
      }

      .hero-name {
        font-size: clamp(2.5rem, 5.5vw, 5.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 1.2rem;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
      }

      .hero-subtitle {
        font-size: clamp(0.85rem, 1.4vw, 1.2rem);
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }

      /* Columna Derecha: Imagen */
      .hero-image-content {
        flex: 1 1 45%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1;
      }

      .hero-image-container {
        position: relative;
        width: min(420px, 80vw);
        height: min(420px, 80vw);
        border-radius: 50%;
        overflow: hidden;
        background-color: #111111;
        box-shadow:
          0 25px 50px -12px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.5s ease;
      }

      .hero-image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        display: block;
        border-radius: 50%;
        filter: grayscale(100%) contrast(105%);
        transition:
          filter 0.4s ease,
          transform 0.4s ease,
          border-radius 0.5s ease;
        color: transparent;
        font-size: 0;
      }

      .hero-image-container:hover img {
        filter: grayscale(0%) contrast(100%);
        transform: scale(1.03);
      }

      /* */
      /* Adaptabilidad Responsiva (Móviles / Tablets - Viewports menores a Desktop) */
      @media (max-width: 900px) {
        .hero-container {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 2rem 1.5rem;
          text-align: center;
          min-height: 100vh;
          position: relative;
        }

        /* Texto por delante */
        .hero-text-content {
          flex: none;
          width: 100%;
          align-items: center;
          z-index: 2;
          position: relative;
        }

        .hero-name {
          font-size: clamp(2.2rem, 9vw, 3.8rem);
        }

        .hero-subtitle {
          letter-spacing: 0.15em;
          font-size: clamp(0.75rem, 3.2vw, 1rem);
        }

        /* La imagen pasa a cubrir el fondo detrás del texto */
        .hero-image-content {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          z-index: 1;
          pointer-events: none;
        }

        .hero-image-container {
          width: 100%;
          height: 100%;
          border-radius: 0;
          box-shadow: none;
          background-color: transparent;
        }

        .hero-image-container img {
          border-radius: 0;
          opacity: 0.35; /* Suavizado para legibilidad del texto */
          filter: grayscale(100%) contrast(110%);
          object-position: center 20%;
        }

        /* Capa gradiente oscura para asegurar contraste perfecto del texto */
        .hero-image-container::after {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(
            circle,
            rgba(5, 5, 5, 0.4) 0%,
            rgba(5, 5, 5, 0.92) 80%
          );
        }
      }
    </style>

    <!-- Animaciones (aditivo: no altera ninguna regla del diseño base) -->
    <style id="ceo-anim">
      .ceo-stage {
        min-height: 100vh;
      }

      .ceo-close {
        opacity: 0.4;
        transition: opacity 0.3s ease;
      }
      .ceo-close:hover,
      .ceo-close:focus-visible {
        opacity: 1;
      }

      @media (prefers-reduced-motion: no-preference) {
        @keyframes ceoFadeUp {
          from {
            opacity: 0;
            transform: translateY(24px);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
        @keyframes ceoFadeImg {
          from {
            opacity: 0;
            transform: scale(0.94);
          }
          to {
            opacity: 1;
            transform: none;
          }
        }
        .hero-text-content {
          animation: ceoFadeUp 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) both;
        }
        .hero-image-content {
          animation: ceoFadeImg 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) 0.15s
            both;
        }

        @keyframes ceoCircleClose {
          from {
            clip-path: circle(150% at 50% 50%);
          }
          to {
            clip-path: circle(0% at 50% 50%);
          }
        }
        body.ceo-out .ceo-stage {
          animation: ceoCircleClose 1.8s cubic-bezier(0.45, 0, 0.25, 1) forwards;
        }
        body.ceo-out .ceo-close {
          opacity: 0;
          transition: opacity 0.25s ease;
        }
      }
    </style>
  </head>
  <body>
    <!-- Botón de retorno (X) -->
    <button
      type="button"
      class="ceo-close"
      aria-label="Cerrar"
      title="Volver"
      onclick="window.ceoExit && window.ceoExit()"
      style="
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 1000;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.2);
        color: rgba(255, 255, 255, 0.9);
        font-family: &quot;Space Grotesk&quot;, sans-serif;
        font-size: 1.6rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        padding: 0;
      "
    >
      &times;
    </button>

    <!-- Contenedor Principal -->
    <div class="ceo-stage">
      <main class="hero-container">
        <!-- Texto e Identidad -->
        <div class="hero-text-content">
          <h1 class="hero-name">Carlos Colmenares A.</h1>
          <p class="hero-subtitle">Project and Software Engineer</p>
        </div>

        <!-- Imagen de Perfil (A la derecha en Desktop, de fondo en Móvil) -->
        <div class="hero-image-content">
          <div class="hero-image-container">
            <img
              id="profile-img"
              src="../img/ceo/ceo.webp"
              alt="Carlos Colmenares A."
              width="420"
              height="420"
              onerror="handleImageError(this)"
            />
          </div>
        </div>
      </main>
    </div>

    <script>
      (function () {
        var reduce = !!(
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches
        );
        var done = false;

        function goBack() {
          if (done) return;
          done = true;
          if (history.length > 1) {
            history.back();
          } else {
            window.location.href = "../../index.html";
          }
        }

        window.ceoExit = function () {
          var stage = document.querySelector(".ceo-stage");
          if (reduce || !stage) {
            goBack();
            return;
          }
          document.body.classList.add("ceo-out");
          stage.addEventListener("animationend", goBack, { once: true });
          setTimeout(goBack, 3000);
        };
      })();
    </script>
  </body>
</html>
